# Integration Connector Configuration

# Info section
info:
  logo: "https://example.com/logo.png"
  name: "Example CRM Integration"
  categories:
    - "CRM"
    - "Sales"
  website: "https://example.com"
  support_email: "support@example.com"
  version: "1.0.0"
  developer: "Your Company Name"

# Authentication section
authentication:
  auth_method: "oauth2"
  oauth2:
    client_id: "${CLIENT_ID}"
    client_secret: "${CLIENT_SECRET}"
    auth_uri: "https://example.com/oauth/authorize"
    token_uri: "https://example.com/oauth/token"
    scopes:
      - "read"
      - "write"

# Entities section
entities:
  - "deal"
  - "company"
  - "contact"

# Actions section
actions:
  - action_id: "update"
    entities: ["deal", "company", "contact"]
  - action_id: "attach_document"
    entities: ["deal", "company"]
  - action_id: "add_history"
    entities: ["deal"]