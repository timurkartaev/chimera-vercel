<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PandaDoc Document List for Gong CRM</title>
    <script src="https://pd-js-sdk.s3.amazonaws.com/0.2.20/pandadoc-js-sdk.min.js"></script>
    <link rel="stylesheet" href="https://pd-js-sdk.s3.amazonaws.com/0.2.20/pandadoc-js-sdk.css" />
    <style>
        #pandadoc-list {
            width: 100%;
            height: 700px;
        }

        .pandadoc iframe {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="pandadoc-list" class="pandadoc"></div>
    <script>
        var doclist = new PandaDoc.DocList({ mode: PandaDoc.DOC_LIST_MODE.LIST });
        doclist.init({
            el: '#pandadoc-list',
            // Optionally filter by metadata, etc.
            // data: {
            //     metadata: {
            //         crm_id: "GONG_OPPORTUNITY_ID"
            //     }
            // },
            cssClass: 'pandadoc',
            events: {
                onInit: function () { console.log('DocList Loaded!'); },
                onDocumentCreate: function () { console.log('Document Created!'); }
            }
        });
    </script>
</body>

</html>
