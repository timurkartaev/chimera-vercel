<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Authentication Complete</title>
</head>
<body>
  <script>
    (function() {
      // Notify opener window (the parent that opened this popup)
      if (window.opener && !window.opener.closed) {
        // Example: call a function on the opener to notify auth success
        console.log("Authentication successful, notifying opener window.");
        if (typeof window.opener.onAuthSuccess === "function") {
          window.opener.onAuthSuccess({ state: "{{ state }}" });
        } else {
          // Or send a message event with the state (recommended if you control both windows)
          window.opener.postMessage({ type: "authSuccess", state: "{{ state }}" }, "*");
        }
      }
      // Close the popup window
      window.close();
    })();
  </script>
  <p>Authentication finished. You can close this window. The state was '{{ state }}'.</p>
</body>
</html>
